# Publishes site/ to GitHub Pages (custom domain doughknee.com via site/CNAME).
# One-time: repo Settings → Pages → Source "GitHub Actions", then set the custom domain.
name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/PRIVACY.md"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Without Pillow, build.py reuses whatever WebP is already committed, so a
      # newly dropped PNG would deploy as the old picture with no error.
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python site/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
